name: FTAC Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Run from the Actions tab; on main this also deploys the docs.
  workflow_dispatch:
  # Called by build_release.yml on a version tag.
  workflow_call:

env:
  NPM_VERSION: 11
  # The site is a project page under graycoreio.github.io, so it is built
  # for that path. Remove this once a custom domain serves it from /.
  DOCS_BASE: /ftac/

permissions:
  contents: read
  actions: read # nx-set-shas reads the last successful workflow run

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: nrwl/nx-set-shas@v5
        name: Derive appropriate SHAs for base and head for `nx affected` commands
        with:
          main-branch-name: 'main'

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: ${{ matrix.node }}
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      - run: npx nx run-many -t typecheck

      - run: npx nx run-many -t test

      # Every example pipeline JSON must be committed in sync with its source.
      - run: npx nx run-many -t check

      - name: Generated files are in sync
        run: git diff --exit-code

      - run: npx nx run docs:build

      - run: npx nx run ftac:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy-docs:
    name: Deploy Docs
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  build-success:
    name: Build Success
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check build result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi
