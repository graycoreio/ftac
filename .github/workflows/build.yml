name: FTAC Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NPM_VERSION: 11

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: nrwl/nx-set-shas@v5
        name: Derive appropriate SHAs for base and head for `nx affected` commands
        with:
          main-branch-name: 'main'

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: ${{ matrix.node }}
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      - run: npx nx run-many -t typecheck

      - run: npx nx run-many -t test

      # Every example pipeline JSON must be committed in sync with its source.
      - run: npx nx run-many -t check

      - name: Generated files are in sync
        run: git diff --exit-code

      - run: npx nx run docs:build

  build-success:
    name: Build Success
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check build result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi
